<!DOCTYPE html>
<html lang="am">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AL NASRU - Tracking & Admin System</title>

<!-- WhatsApp Link Preview Meta Tags -->
<meta property="og:title" content="MOFA Attestation - Receipt" />
<meta property="og:description" content="Your file status update. Open link or scan to track live." />
<meta property="og:type" content="website" />
<meta property="og:url" content="https://nesruchane57-eng.github.io/AL-NESRU-Tracking/" />
<meta property="og:image" content="https://quickchart.io/qr?text=https://nesruchane57-eng.github.io/AL-NESRU-Tracking/&size=400" />
<meta property="og:image:width" content="400" />
<meta property="og:image:height" content="400" />

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
body{background:#0b0f19;color:#e5e7eb;display:flex;justify-content:center;min-height:100vh;padding:10px}
.app-container{width:100%;max-width:480px;background:#111827;border-radius:16px;padding:20px;box-shadow:0 10px 30px rgba(0,0,0,.8);border:1px solid #1f2937}
.brand-header{text-align:center;margin-bottom:20px;padding-bottom:12px;border-bottom:1px solid #1f2937}
.brand-header h1{font-size:26px;letter-spacing:2px;color:#fff;font-weight:800}
.brand-header p{font-size:11px;color:#9ca3af;letter-spacing:1px}
.tab-menu{display:flex;background:#1f2937;padding:4px;border-radius:10px;margin-bottom:20px}
.tab-btn{background:none;border:none;color:#9ca3af;padding:10px;font-size:14px;font-weight:bold;cursor:pointer;border-radius:8px;width:50%;transition:.3s}
.tab-btn.active{background:#0284c7;color:#fff}
.card{background:#1f2937;padding:16px;border-radius:12px;margin-bottom:15px;border:1px solid #374151;position:relative}
label{font-size:12px;color:#9ca3af;display:block;margin-bottom:6px;font-weight:bold}
input,select{width:100%;padding:12px;background:#0b0f19;border:1px solid #374151;border-radius:8px;color:#fff;font-size:14px;outline:none;margin-bottom:12px}
input:focus,select:focus{border-color:#0284c7}
.btn{background:#0284c7;color:#fff;border:none;padding:12px;border-radius:8px;font-weight:bold;cursor:pointer;width:100%;font-size:15px}
.btn:disabled{opacity:.6;cursor:not-allowed}
.badge{position:absolute;top:16px;right:16px;background:rgba(16,185,129,.15);color:#10b981;border:1px solid #10b981;padding:4px 10px;border-radius:12px;font-size:11px;font-weight:bold}
.code-title{color:#f59e0b;font-weight:bold;font-size:15px}
.cust-name{font-size:17px;font-weight:bold;margin:6px 0;color:#fff;padding-right:100px}
.details{font-size:13px;color:#9ca3af;line-height:1.7}
.status-steps{margin-top:15px;padding-top:15px;border-top:1px solid #374151}
.step-item{display:flex;align-items:center;font-size:13px;color:#6b7280;margin-bottom:8px}
.step-item.active{color:#10b981;font-weight:bold}
.dot{width:10px;height:10px;border-radius:50%;background:#4b5563;margin-right:10px;flex:none}
.step-item.active .dot{background:#10b981;box-shadow:0 0 8px #10b981}
.qr-wrapper{display:flex;flex-direction:column;align-items:center;background:#0b0f19;padding:15px;border-radius:10px;margin-top:15px;border:1px solid #374151}
.qr-code-box{background:#fff;padding:8px;border-radius:6px}
.small-btn{margin-top:10px;background:#374151;color:#fff;border:0;padding:8px 12px;border-radius:7px;cursor:pointer}
.hidden{display:none}
.error{color:#f87171;text-align:center;padding:15px;line-height:1.5}
.notice{background:#3f2b0b;border:1px solid #f59e0b;color:#fcd34d;padding:10px;border-radius:8px;font-size:12px;line-height:1.5;margin-bottom:12px}
.logout-btn{background:#ef4444;color:#fff;border:none;padding:6px 12px;border-radius:6px;font-size:12px;cursor:pointer;float:right}
</style>
</head>
<body>
<div class="app-container">
<div class="brand-header">
<h1>AL NASRU</h1>
<p>AGENCY TRACKING SYSTEM</p>
</div>

<div class="tab-menu">
<button class="tab-btn active" id="btnTabTrack" onclick="switchTab('track')">Track Files</button>
<button class="tab-btn" id="btnTabAdmin" onclick="switchTab('admin')">Admin Panel</button>
</div>

<!-- TRACK TAB (ለደንበኞች የሚታይ) -->
<div id="trackTab">
<div class="card">
<label>SEARCH BY PHONE OR RECEIPT CODE</label>
<input type="text" id="searchInput" placeholder="09... / ATT-2026-...">
<button class="btn" id="searchBtn" onclick="searchFile()">Search / ፈልግ</button>
</div>
<div id="searchResults"></div>
</div>

<!-- ADMIN TAB -->
<div id="adminTab" class="hidden">

<!-- SUPABASE AUTH ADMIN LOGIN FORM -->
<form id="adminLoginForm" class="card" onsubmit="handleSupabaseLogin(event)">
<h3 style="color:#38bdf8;margin-bottom:15px;font-size:16px">Supabase Admin Login</h3>
<label>Supabase Email</label>
<input type="email" id="loginEmail" placeholder="your-email@gmail.com" required autocapitalize="none" autocomplete="username">
<label>Supabase Password</label>
<input type="password" id="loginPassword" placeholder="••••••••" required autocomplete="current-password">
<button class="btn" id="loginBtn" type="submit">Login to Dashboard</button>
</form>

<!-- ADMIN DASHBOARD -->
<div id="adminDashboard" class="hidden">
<div style="margin-bottom:15px;overflow:hidden">
<button class="logout-btn" onclick="handleSupabaseLogout()">Logout</button>
<span id="userEmailBadge" style="font-size:12px;color:#10b981;font-weight:bold">Logged in</span>
</div>

<div class="card">
<h3 style="color:#38bdf8;margin-bottom:15px;font-size:16px">Add & Send to WhatsApp</h3>
<div class="notice">
አስፈላጊ፦ ይህ ፋይል online ላይ ከተጫነ በኋላ የWhatsApp tracking link እና የ QR ምስል ለደንበኛው ይላካል።
</div>
<label>Customer Name</label>
<input type="text" id="admName" placeholder="HAYAT RESHAD ABDELA">
<label>Receipt Code (file_code)</label>
<input type="text" id="admCode" placeholder="ATT-2026-2432">
<label>Phone Number (WhatsApp)</label>
<input type="text" id="admPhone" placeholder="2519........ or 09........">
<label>Passport Number</label>
<input type="text" id="admPassport" placeholder="E0****314">
<label>MOFA Reference Number</label>
<input type="text" id="admMofa" placeholder="ATS-20260914181828346">
<label>Status</label>
<select id="admStatus">
<option value="Received">Received</option>
<option value="At embassy" selected>At embassy</option>
<option value="Embassy done">Embassy done</option>
<option value="Ready for pickup">Ready for pickup</option>
<option value="Collected">Collected</option>
</select>
<button class="btn" id="saveBtn" style="background:#166534" type="button" onclick="saveAndSendWhatsApp()">
Save & Share to WhatsApp
</button>
</div>
</div>

</div>
</div>

<script>
// ===============================
// SUPABASE CONFIGURATION
// ===============================
const SUPABASE_URL = 'https://cxlaebwiibzvedaupmtr.supabase.co';
const SUPABASE_KEY = 'sb_publishable_wwJIy_f5u8ZKYYKi1w87aA_CVHt_7Ou';
const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const WEBSITE_URL = 'https://nesruchane57-eng.github.io/AL-NESRU-Tracking/';

// ===============================
// PAGE INITIALIZATION (ራስ-ሰር መክፈቻ)
// ===============================
window.addEventListener('load', async function() {
// 1. WhatsApp ሊንኩ ሲነካ ኮዱን ከ URL ላይ አንብቦ በራሱ ፍለጋ ይጀምራል
const urlParams = new URLSearchParams(window.location.search);
const code = urlParams.get('code') || urlParams.get('ref') || urlParams.get('search');

if (code) {
document.getElementById('searchInput').value = code;
searchFile();
}

// 2. Admin Login Session Check
const { data: { session } } = await _supabase.auth.getSession();
if (session) {
showDashboard(session.user.email);
}
});

// ===============================
// SUPABASE AUTH LOGIN & LOGOUT
// ===============================
async function handleSupabaseLogin(e) {
if (e) e.preventDefault();

const email = document.getElementById('loginEmail').value.trim();
const password = document.getElementById('loginPassword').value;
const loginBtn = document.getElementById('loginBtn');

loginBtn.disabled = true;
loginBtn.textContent = 'Verifying... / በመፈተሽ ላይ...';

try {
const { data, error } = await _supabase.auth.signInWithPassword({
email: email,
password: password,
});

if (error) throw error;

alert('በተሳካ ሁኔታ ገብተዋል!');
showDashboard(data.user.email);
document.getElementById('loginPassword').value = '';

} catch (err) {
console.error(err);
alert('የመግቢያ ስህተት፦ ' + (err.message || 'ኢሜል ወይም ፓስወርድ አልተገኘም'));
} finally {
loginBtn.disabled = false;
loginBtn.textContent = 'Login to Dashboard';
}
}

async function handleSupabaseLogout() {
await _supabase.auth.signOut();
document.getElementById('adminLoginForm').classList.remove('hidden');
document.getElementById('adminDashboard').classList.add('hidden');
}

function showDashboard(email) {
document.getElementById('adminLoginForm').classList.add('hidden');
document.getElementById('adminDashboard').classList.remove('hidden');
document.getElementById('userEmailBadge').textContent = 'Admin: ' + email;
}

// ===============================
// TAB SWITCHING
// ===============================
function switchTab(tab) {
document.getElementById('btnTabTrack').classList.toggle('active', tab === 'track');
document.getElementById('btnTabAdmin').classList.toggle('active', tab === 'admin');
document.getElementById('trackTab').classList.toggle('hidden', tab !== 'track');
document.getElementById('adminTab').classList.toggle('hidden', tab !== 'admin');
}

// ===============================
// SEARCH FILE
// ===============================
async function searchFile() {
const query = document.getElementById('searchInput').value.trim();
const container = document.getElementById('searchResults');
const button = document.getElementById('searchBtn');

if (!query) {
alert('እባክዎን ስልክ ቁጥር ወይም የፋይል ኮድ ያስገቡ');
return;
}

container.innerHTML = '<p style="text-align:center;padding:20px">Searching... / በመፈለግ ላይ...</p>';
button.disabled = true;

try {
let result = await _supabase
.from('files')
.select('file_code,customer_name,phone_number,passport_number,mofa_ref,status')
.eq('file_code', query);

if (result.error) throw result.error;
let data = result.data;

if (!data || data.length === 0) {
result = await _supabase
.from('files')
.select('file_code,customer_name,phone_number,passport_number,mofa_ref,status')
.eq('phone_number', query);

if (result.error) throw result.error;
data = result.data;
}

if (!data || data.length === 0) {
container.innerHTML = '<p style="text-align:center;color:#9ca3af;padding:20px">ምንም ፋይል አልተገኘም።</p>';
return;
}

container.innerHTML = '';
data.forEach(function(item) {
renderFileCard(item, container);
});

} catch (error) {
console.error(error);
container.innerHTML = '<div class="error"><b>Search failed</b><br>' + escapeHtml(error.message) + '</div>';
} finally {
button.disabled = false;
}
}

// ===============================
// DISPLAY CARD
// ===============================
function renderFileCard(item, container) {
const card = document.createElement('div');
card.className = 'card';
const qrId = 'qr_' + Math.random().toString(36).slice(2, 11);
const trackingLink = WEBSITE_URL + '?code=' + encodeURIComponent(item.file_code);
const statuses = ['Received', 'At embassy', 'Embassy done', 'Ready for pickup', 'Collected'];

let steps = '';
statuses.forEach(function(status) {
steps += '<div class="step-item ' + (item.status === status ? 'active' : '') + '">' +
'<div class="dot"></div>' + escapeHtml(status) + '</div>';
});

card.innerHTML =
'<div class="code-title">ATT Code: ' + escapeHtml(item.file_code) + '</div>' +
'<div class="badge">' + escapeHtml(item.status || 'Received') + '</div>' +
'<div class="cust-name">' + escapeHtml(item.customer_name || 'N/A') + '</div>' +
'<div class="details">' +
'<div>Passport: ' + escapeHtml(item.passport_number || 'N/A') + '</div>' +
'<div>MOFA Ref: ' + escapeHtml(item.mofa_ref || 'N/A') + '</div>' +
'<div>Phone: ' + escapeHtml(item.phone_number || 'N/A') + '</div>' +
'</div>' +
'<div class="status-steps">' + steps + '</div>' +
'<div class="qr-wrapper">' +
'<div id="' + qrId + '" class="qr-code-box"></div>' +
'<div style="font-size:11px;margin-top:8px;color:#9ca3af">Scan QR to Track Live</div>' +
'<button class="small-btn" onclick="copyTrackingLink('' + escapeJs(item.file_code) + '')">Copy Tracking Link</button>' +
'</div>';

container.appendChild(card);

new QRCode(document.getElementById(qrId), {
text: trackingLink,
width: 130,
height: 130
});
}

// ===============================
// SAVE & SHARE TO WHATSAPP (WITH QR IMAGE PREVIEW)
// ===============================
async function saveAndSendWhatsApp() {
const name = document.getElementById('admName').value.trim();
const code = document.getElementById('admCode').value.trim();
let phone = document.getElementById('admPhone').value.trim();
const passport = document.getElementById('admPassport').value.trim();
const mofa = document.getElementById('admMofa').value.trim();
const status = document.getElementById('admStatus').value;
const saveBtn = document.getElementById('saveBtn');

if (!name || !code || !phone) {
alert('እባክዎን የደንበኛ ስም፣ የፋይል ኮድ እና ስልክ ቁጥር ያስገቡ');
return;
}

let whatsappPhone = phone.replace(/[^\d]/g, '');
if (whatsappPhone.startsWith('0')) {
whatsappPhone = '251' + whatsappPhone.substring(1);
}

saveBtn.disabled = true;
saveBtn.textContent = 'Saving... / በማስቀመጥ ላይ...';

try {
// 1. Database ላይ መዝግብ
const result = await _supabase
.from('files')
.upsert([{
customer_name: name,
file_code: code,
phone_number: phone,
passport_number: passport,
mofa_ref: mofa,
status: status
}], { onConflict: 'file_code' });

if (result.error) throw result.error;

// 2. የደንበኛው መከታተያ Link እና የ QR Code ምስል Link
const trackingLink = WEBSITE_URL + '?code=' + encodeURIComponent(code);
const qrImageUrl = 'https://quickchart.io/qr?text=' + encodeURIComponent(trackingLink) + '&size=350';

// 3. WhatsApp መልእክት
const message = 'MOFA ATTESTATION — Track your file\n\n' +
'Receipt: ' + code + '\n' +
'Customer: ' + name + '\n' +
'MOFA ref: ' + (mofa || 'N/A') + '\n\n' +
'QR Code Image:\n' + qrImageUrl + '\n\n' +
'Open this link for live status:\n' +
trackingLink;

const waUrl = 'https://api.whatsapp.com/send?phone=' + encodeURIComponent(whatsappPhone) + '&text=' + encodeURIComponent(message);

alert('ፋይሉ በትክክል ተቀምጧል። WhatsApp እየተከፈተ ነው።');
window.open(waUrl, '_blank');

} catch (error) {
console.error(error);
alert('Supabase Error: ' + error.message);
} finally {
saveBtn.disabled = false;
saveBtn.textContent = 'Save & Share to WhatsApp';
}
}

// ===============================
// HELPER FUNCTIONS
// ===============================
async function copyTrackingLink(code) {
const link = WEBSITE_URL + '?code=' + encodeURIComponent(code);
try {
await navigator.clipboard.writeText(link);
alert('Tracking link copied!');
} catch (e) {
prompt('Copy this tracking link:', link);
}
}

function escapeHtml(value) {
return String(value)
.replace(/&/g, '&')
.replace(/</g, '<')
.replace(/>/g, '>')
.replace(/"/g, '"')
.replace(/'/g, ''');
}

function escapeJs(value) {
return String(value)
.replace(/\/g, '\\')
.replace(/'/g, "\'")
.replace(/\r/g, '\r')
.replace(/\n/g, '\n');
}
</script>
</body>
</html>
